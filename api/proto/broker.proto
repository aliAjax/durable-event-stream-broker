syntax = "proto3";
package broker.v1;
service Broker { rpc Append(AppendRequest) returns (AppendResponse); rpc Fetch(FetchRequest) returns (FetchResponse); }
message AppendRequest { string tenant_id=1; string topic_id=2; int32 partition=3; bytes payload=4; }
message AppendResponse { int64 first_offset=1; int64 last_offset=2; }
message FetchRequest { string topic_id=1; int32 partition=2; int64 after_offset=3; }
message FetchResponse { repeated bytes records=1; }
