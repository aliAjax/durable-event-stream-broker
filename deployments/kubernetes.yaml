apiVersion: apps/v1
kind: Deployment
metadata: {name: event-broker}
spec:
  replicas: 1
  selector: {matchLabels: {app: event-broker}}
  template:
    metadata: {labels: {app: event-broker}}
    spec:
      containers:
      - name: broker
        image: event-broker:latest
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /readyz, port: 8080}}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: event-broker}
spec: {selector: {app: event-broker}, ports: [{port: 8080, targetPort: 8080}]}
